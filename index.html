<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak Language Center – Progress Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#0b2f5e;--yel:#fdc92b;--bg:#f4f6fb;--ok:#22a55b;--prog:#f2a900;--na:#9aa5b8;--card:#fff;--tx:#1d2a40}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:4px solid var(--yel);display:flex;align-items:center;gap:14px;padding:8px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header img.l{height:46px}header img.m{height:46px}header h1{font:20px 'Fredoka One',sans-serif;color:var(--navy);margin:0;flex:1;min-width:160px}
#save{font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px;background:#eef1f7;color:var(--na);transition:.3s}
#save.ok{background:#e0f5ea;color:var(--ok)}#save.err{background:#fde6e6;color:#d33}#save.sv{background:#fff4d6;color:#a77800}
.wrap{display:flex;gap:16px;padding:16px;max-width:1300px;margin:auto}
aside{width:280px;flex-shrink:0;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px #0b2f5e14;align-self:flex-start;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
main{flex:1;min-width:0}
input,select,button{font:inherit}
.in{width:100%;padding:9px 12px;border:2px solid #dfe5f0;border-radius:10px;background:#fff;color:var(--tx)}
.in:focus{outline:none;border-color:var(--navy)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px #0b2f5e33}.btn:active{transform:scale(.97)}
.btn.y{background:var(--yel);color:var(--navy)}.btn.g{background:#e8edf6;color:var(--navy)}.btn.r{background:#d33}.btn.s{padding:5px 9px;font-size:12px}
.lv{font-weight:800;font-size:12px;color:var(--navy);margin:12px 0 4px;letter-spacing:.5px}
.st{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--tx);font-weight:600;transition:.15s}
.st:hover{background:#eef2fa}.st.on{background:var(--navy);color:#fff}
.hero{background:linear-gradient(135deg,var(--navy),#1b5aa6);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;animation:up .4s}
.hero h2{margin:0 0 4px;font:26px 'Fredoka One',sans-serif}.hero small{opacity:.85}
.prg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.pc{background:#ffffff1f;border-radius:12px;padding:10px}.bar{height:10px;background:#ffffff33;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--yel);border-radius:9px;transition:width .7s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:#ffffff26;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar2 .in{width:auto;flex:1;min-width:130px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{border:0;padding:9px 16px;border-radius:12px;font-weight:800;cursor:pointer;background:#fff;color:var(--navy);transition:.15s}
.tab.on{background:var(--yel)}
h3.cat{margin:16px 0 6px;color:var(--navy);font-size:15px}
.tc{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:10px;align-items:center;border-left:6px solid var(--na);box-shadow:0 1px 6px #0b2f5e12;transition:.2s;animation:up .3s}
.tc:hover{transform:translateX(3px)}.tc.completed{border-color:var(--ok)}.tc.in_progress{border-color:var(--prog)}
.tc b{font-size:15px}.tc label{display:block;font-size:11px;font-weight:800;color:var(--na);text-transform:uppercase}
.tc .in{padding:7px 9px}.fd{font-size:12px;color:var(--navy);font-weight:700;min-height:16px}
.ov{position:fixed;inset:0;background:#0b2f5e88;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.md{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;animation:up .25s}
.md h4{margin:0 0 12px;font:20px 'Fredoka One',sans-serif;color:var(--navy)}.md label{font-weight:700;font-size:13px;display:block;margin:10px 0 3px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.empty{text-align:center;padding:40px;color:var(--na)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f7}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:860px){.wrap{flex-direction:column;padding:10px}aside{width:100%;position:static;max-height:240px}.tc{grid-template-columns:1fr 1fr}.tc>div:first-child{grid-column:1/-1}}
</style></head><body>

async function loadAll(){
 const[a,b,c,d]=await Promise.all([db.from('students').select('*').eq('active',true).order('name'),db.from('teachers').select('*').eq('active',true).order('name'),db.from('topics').select('*').order('sort_order'),db.from('student_progress').select('student_id,updated_at,teacher_id,topic_id,status')]);
 if(a.error||b.error||c.error||d.error){failed();return}
 S.students=a.data;S.teachers=b.data;S.topics=c.data;S.all=d.data}
async function loadProg(){
 const{data,error}=await db.from('student_progress').select('*').eq('student_id',S.cur);
 if(error){failed();return}S.prog={};data.forEach(r=>S.prog[r.topic_id]=r);
 S.all=S.all.filter(r=>r.student_id!==S.cur).concat(data);render()}
async function select(id){S.cur=id;S.lvl=S.students.find(s=>s.id===id).level_id;S.fs='';S.ft='';await loadProg()}
const tname=id=>(S.teachers.find(t=>t.id===id)||{}).name||'';
function stats(sid,lv){const ts=S.topics.filter(t=>t.level_id===lv),ids=new Set(ts.map(t=>t.id));
 const rs=S.all.filter(r=>r.student_id===sid&&ids.has(r.topic_id));const c=rs.filter(r=>r.status==='completed').length,p=rs.filter(r=>r.status==='in_progress').length;
 return{t:ts.length,c,p,n:ts.length-c-p,pct:ts.length?Math.round(c/ts.length*100):0}}
function render(){side();main()}
function side(){const q=S.q.toLowerCase();let h='';
 for(const l of[1,2,3]){const ls=S.students.filter(s=>s.level_id===l&&(!q||s.name.toLowerCase().includes(q)));
  if(ls.length)h+=`<div class="lv">${LV[l].n} — ${LV[l].c}</div>`+ls.map(s=>`<button class="st ${s.id===S.cur?'on':''}" onclick="select(${s.id})">${esc(s.name)}</button>`).join('')}
 $('side').innerHTML=h||'<div class="empty">No students found</div>'}
function main(){const s=S.students.find(x=>x.id===S.cur);if(!s){$('main').innerHTML='<div class="empty">Select or add a student to begin.</div>';return}
 const mine=S.all.filter(r=>r.student_id===s.id).sort((a,b)=>b.updated_at.localeCompare(a.updated_at))[0];
 const tot=[1,2,3].reduce((a,l)=>{const x=stats(s.id,l);a.c+=x.c;a.p+=x.p;a.n+=x.n;return a},{c:0,p:0,n:0});
 let h=`<div class="hero"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><h2>${esc(s.name)}</h2><small>Current level: ${LV[s.level_id].n} — ${LV[s.level_id].c}</small></div><div><button class="btn y s" onclick="editStudent()">✎ Edit</button> <button class="btn r s" onclick="delStudent()">Delete</button></div></div><div class="prg">`;
 for(const l of[1,2,3]){const x=stats(s.id,l);h+=`<div class="pc"><b>${LV[l].c} — ${x.pct}% Complete</b><div class="bar"><i style="width:${x.pct}%"></i></div></div>`}
 h+=`</div><div class="chips"><span class="chip">🟢 ${tot.c} completed</span><span class="chip">🟡 ${tot.p} in progress</span><span class="chip">⚪ ${tot.n} not addressed</span>${mine?`<span class="chip">Last updated: ${fmt(mine.updated_at.slice(0,10))}${mine.teacher_id?' by '+esc(tname(mine.teacher_id)):''}</span>`:''}</div></div>`;
 h+=`<div class="tabs">${[1,2,3].map(l=>`<button class="tab ${l===S.lvl?'on':''}" onclick="S.lvl=${l};render()">${LV[l].n} — ${LV[l].c}</button>`).join('')}</div>`;
 h+=`<div class="bar2"><select class="in" onchange="S.fs=this.value;render()"><option value="">Filter by Status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${S.fs===k?'selected':''}>${v}</option>`).join('')}</select>
 <select class="in" onchange="S.ft=this.value;render()"><option value="">Filter by Teacher</option>${S.teachers.map(t=>`<option value="${t.id}" ${S.ft==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
 <button class="btn y" onclick="topicForm()">+ Add Topic</button></div>
 <h3 style="margin:0;color:var(--navy)">${LV[S.lvl].n} — ${LV[S.lvl].c} <small style="font-weight:600;color:var(--na)">${LV[S.lvl].d}</small></h3>`;
 const q=S.q.toLowerCase();let ts=S.topics.filter(t=>t.level_id===S.lvl).filter(t=>{const p=S.prog[t.id]||{status:'not_addressed'};
  return(!S.fs||p.status===S.fs)&&(!S.ft||p.teacher_id==S.ft)&&(!q||t.topic_name.toLowerCase().includes(q)||t.category.toLowerCase().includes(q)||tname(p.teacher_id).toLowerCase().includes(q)||LV[t.level_id].c.toLowerCase()===q||s.name.toLowerCase().includes(q))});
 if(!ts.length)h+='<div class="empty">No topics match your filters.</div>';
 let cat='';for(const t of ts){if(t.category!==cat){cat=t.category;h+=`<h3 class="cat">${esc(cat)}</h3>`}
  const p=S.prog[t.id]||{status:'not_addressed'};
  h+=`<div class="tc ${p.status}"><div><b>${esc(t.topic_name)}</b></div>
  <div><label>Teacher</label><select class="in" onchange="upd(${t.id},'teacher_id',this.value)"><option value="">— Select —</option>${S.teachers.map(x=>`<option value="${x.id}" ${p.teacher_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  <div><label>Date</label><input class="in" type="date" value="${p.date_taught||''}" onchange="upd(${t.id},'date_taught',this.value)"><div class="fd">${fmt(p.date_taught)}</div></div>
  <div><label>Status</label><select class="in" onchange="upd(${t.id},'status',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div><button class="btn g s" title="Edit topic" onclick="topicForm(${t.id})">✎</button> <button class="btn g s" title="Delete topic" onclick="delTopic(${t.id})">🗑</button></div></div>`}
 $('main').innerHTML=h}
async function upd(tid,f,v){const old=S.prog[tid];
 const row={student_id:S.cur,topic_id:tid,status:'not_addressed',...(old||{})};delete row.id;
 row[f]=f==='teacher_id'?(v?Number(v):null):(f==='date_taught'?(v||null):v);row.updated_at=new Date().toISOString();
 saving();const{data,error}=await db.from('student_progress').upsert(row,{onConflict:'student_id,topic_id'}).select().single();
 if(error){failed();render();return}S.prog[tid]=data;S.all=S.all.filter(r=>!(r.student_id===S.cur&&r.topic_id===tid)).concat(data);saved();render()}
function modal(title,body,ok,fn,label){$('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="md"><h4>${title}</h4>${body}<div class="ma"><button class="btn g" onclick="closeM()">Cancel</button>${ok?`<button class="btn ${ok==='del'?'r':''}" id="okb">${label||'Save'}</button>`:''}</div></div></div>`;
 if(ok)$('okb').onclick=async()=>{if(await fn()!==false)closeM()};const f=document.querySelector('#ov input');if(f)f.focus()}
const closeM=()=>$('ov').innerHTML='';
const lvOpts=sel=>[1,2,3].map(l=>`<option value="${l}" ${l==sel?'selected':''}>${LV[l].n} — ${LV[l].c}</option>`).join('');
const confirmDel=(msg,fn)=>modal('Please confirm',`<p>${msg}</p>`,'del',fn,'Delete');
async function run(p){saving();const{error}=await p;if(error){failed();return false}saved();return true}
function addStudent(){modal('Add Student','<label>Student name</label><input class="in" id="f1"><label>Level</label><select class="in" id="f2">'+lvOpts(1)+'</select>',1,async()=>{
 const n=$('f1').value.trim();if(!n)return false;saving();const{data,error}=await db.from('students').insert({name:n,level_id:+$('f2').value}).select().single();
 if(error){failed();return false}saved();S.students.push(data);S.students.sort((a,b)=>a.name.localeCompare(b.name));select(data.id)},'Create Student')}
function editStudent(){const s=S.students.find(x=>x.id===S.cur);modal('Edit Student',`<label>Student name</label><input class="in" id="f1" value="${esc(s.name)}"><label>Current level</label><select class="in" id="f2">${lvOpts(s.level_id)}</select>`,1,async()=>{
 const n=$('f1').value.trim();if(!n)return false;const u={name:n,level_id:+$('f2').value};if(!await run(db.from('students').update(u).eq('id',s.id)))return false;Object.assign(s,u);render()})}
function delStudent(){const s=S.students.find(x=>x.id===S.cur);confirmDel('Are you sure you want to delete this student? This action cannot be undone.',async()=>{
 if(!await run(db.from('students').delete().eq('id',s.id)))return false;S.students=S.students.filter(x=>x.id!==s.id);S.all=S.all.filter(r=>r.student_id!==s.id);S.students.length?select(S.students[0].id):(S.cur=null,render())})}
function topicForm(id){const t=S.topics.find(x=>x.id===id)||{level_id:S.lvl,topic_name:'',category:''};const cats=[...new Set(S.topics.map(x=>x.category))];
 modal(id?'Edit Topic':'Add Topic',`<label>Topic name</label><input class="in" id="f1" value="${esc(t.topic_name)}"><label>Level</label><select class="in" id="f2">${lvOpts(t.level_id)}</select><label>Category</label><input class="in" id="f3" list="cl" value="${esc(t.category)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`,1,async()=>{
 const n=$('f1').value.trim();if(!n)return false;const u={topic_name:n,level_id:+$('f2').value,category:$('f3').value.trim()||'General'};
 if(id){if(!await run(db.from('topics').update(u).eq('id',id)))return false;Object.assign(t,u)}
 else{u.sort_order=Math.max(0,...S.topics.map(x=>x.sort_order))+1;saving();const{data,error}=await db.from('topics').insert(u).select().single();if(error){failed();return false}saved();S.topics.push(data)}
 S.topics.sort((a,b)=>a.sort_order-b.sort_order);S.lvl=u.level_id;render()},id?'Save Topic':'Add Topic')}
function delTopic(id){confirmDel('Are you sure you want to delete this topic? This action cannot be undone.',async()=>{
 if(!await run(db.from('topics').delete().eq('id',id)))return false;S.topics=S.topics.filter(t=>t.id!==id);S.all=S.all.filter(r=>r.topic_id!==id);delete S.prog[id];render()})}
function teachers(){const body=()=>S.teachers.map(t=>`<div class="tr"><span>${esc(t.name)}</span><button class="btn r s" onclick="delTeacher(${t.id})">Delete</button></div>`).join('')+'<label>New teacher name</label><input class="in" id="f1">';
 modal('Teachers',body(),1,async()=>{const n=$('f1').value.trim();if(!n)return true;saving();const{data,error}=await db.from('teachers').insert({name:n}).select().single();
 if(error){failed();return false}saved();S.teachers.push(data);S.teachers.sort((a,b)=>a.name.localeCompare(b.name));render()},'+ Add Teacher')}
function delTeacher(id){confirmDel('Are you sure you want to delete this teacher? This action cannot be undone.',async()=>{
 if(!await run(db.from('teachers').delete().eq('id',id)))return false;S.teachers=S.teachers.filter(t=>t.id!==id);await loadProg();setTimeout(teachers,0)})}
init();
</script></body></html>
